<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa en famille</title>
<style>
:root{--bg:#fff8f0;--fg:#2a1a14;--card:#fff;--ac:#b3261e;--mut:#7a6a62;--bd:#e8d8cc;--ok:#1b7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1412;--fg:#f6e9e0;--card:#2a1d1a;--ac:#ff6b5e;--mut:#b9a79d;--bd:#43322d;--ok:#5fd187}}
:root[data-theme="dark"]{--bg:#1d1412;--fg:#f6e9e0;--card:#2a1d1a;--ac:#ff6b5e;--mut:#b9a79d;--bd:#43322d;--ok:#5fd187}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:28px 0 8px}
p{color:var(--mut);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:1rem;margin:4px 6px 4px 0;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font:13px/1.4 ui-monospace,monospace}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--ac);font-weight:600}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.big{font-size:1.2rem}
</style></head><body><main>
<h1>🎁 Secret Santa</h1>
<p>10 participants. Les couples et les groupes parents/enfants ne peuvent pas se piocher.</p>
<button onclick="test()">Test (résultats visibles)</button>
<button class="alt" onclick="real()">Tirage réel (secret)</button>
<div id="out"></div>
<h2>Découvrir ma cible</h2>
<p>Colle le code reçu de l’organisateur.</p>
<textarea id="code" rows="3" placeholder="Code personnel"></textarea>
<button onclick="reveal()">Révéler</button>
<div id="res"></div>
</main>
<script>
const P=["Damien","Capucine","Laurence","Martin","Claire","Lancelot","Papitoine","Mamilene","Nicolas","Marc"];
const G=[["Damien","Capucine"],["Laurence","Martin"],["Claire","Lancelot"],["Papitoine","Mamilene","Nicolas"],["Papitoine","Mamilene","Marc"]];
const bad=(a,b)=>a===b||G.some(g=>g.includes(a)&&g.includes(b));
const rnd=n=>Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n);
function draw(){
  for(let t=0;t<100000;t++){
    const s=[...P];
    for(let i=s.length-1;i>0;i--){const j=rnd(i+1);[s[i],s[j]]=[s[j],s[i]]}
    const m={};let ok=true;
    for(let i=0;i<s.length;i++){const a=s[i],b=s[(i+1)%s.length];if(bad(a,b)){ok=false;break}m[a]=b}
    if(ok)return m;
  }
}
function check(m){
  const r=Object.values(m);
  return P.every(p=>m[p]&&!bad(p,m[p]))&&new Set(r).size===P.length;
}
function test(){
  const m=draw(),ok=check(m);
  document.getElementById("out").innerHTML=
    '<div class="card">'+P.map(p=>'<div class="row"><span>'+p+'</span><span>→ '+m[p]+'</span></div>').join("")+'</div>'+
    '<p class="'+(ok?"ok":"bad")+'">'+(ok?"✓ Chacun offre à une personne et reçoit d’une personne, aucune paire interdite.":"✗ Erreur de contraintes")+'</p>'+
    '<p>Mode test : rien n’est conservé. Clique plusieurs fois pour vérifier.</p>';
}
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function enc(txt){
  const k=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await crypto.subtle.importKey("raw",k,"AES-GCM",false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(txt)));
  return b64(new Uint8Array([...k,...iv,...ct]));
}
async function dec(code){
  const u=unb(code.replace(/\s/g,""));
  const key=await crypto.subtle.importKey("raw",u.slice(0,16),"AES-GCM",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(16,28)},key,u.slice(28)));
}
async function real(){
  const m=draw();
  if(!m||!check(m)){document.getElementById("out").innerHTML='<p class="bad">Erreur, réessaie.</p>';return}
  const url=location.href.split("#")[0];
  let h='<p class="ok">✓ Tirage effectué. Les résultats ne sont pas affichés. Envoie à chacun son message, sans relancer le tirage (sinon les codes changent).</p>';
  for(const p of P){
    const c=await enc(p+"|"+m[p]);
    const msg="Salut "+p+" ! Ton Secret Santa 🎁 Ouvre ce lien : "+url+"#"+c+"\nSi la cible ne s’affiche pas toute seule, ouvre "+url+" et colle ce code dans « Découvrir ma cible » :\n"+c;
    h+='<div class="card"><b>'+p+'</b><textarea readonly rows="4" onclick="this.select()">'+msg+'</textarea><button class="alt" onclick="cp(this)">Copier</button></div>';
  }
  document.getElementById("out").innerHTML=h;
}
function cp(b){
  const t=b.previousElementSibling;t.select();
  try{navigator.clipboard.writeText(t.value);b.textContent="Copié ✓"}catch(e){b.textContent="Sélectionné, copie à la main"}
}
async function reveal(){
  const r=document.getElementById("res");
  try{
    const v=document.getElementById("code").value.trim().split("\n").pop();
    const [a,b]=(await dec(v)).split("|");
    r.innerHTML='<div class="card big">Salut <b>'+a+'</b> ! Tu offres un cadeau à <b>'+b+'</b> 🎄</div><p>Garde le secret, puis ferme cette page.</p>';
  }catch(e){r.innerHTML='<p class="bad">Code invalide. Colle-le en entier.</p>'}
}
window.addEventListener("load",()=>{const h=location.hash.slice(1);if(h.length>30){document.getElementById("code").value=h;reveal()}});
</script></body></html>
